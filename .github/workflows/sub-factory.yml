name: Sub Factory

on:
  workflow_dispatch:
  schedule:
    # 03:33 UTC daily (07:03 Tehran time)
    - cron: '33 3 * * *'

permissions:
  contents: write

jobs:
  build-subscription:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - name: Fetch, clean & split free configs (≤200 per sub link)
        env:
          DERAFSH_SUB_OUT_DIR: out
          DERAFSH_SUB_CHUNK: '200'
        run: python3 tools/sub-factory.py

      - name: Publish to sub branch
        run: |
          git config user.name "derafsh-sub-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan sub-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          # Chunked subscription links: sub1.txt … subN.txt (≤200 configs each,
          # 600 configs → 3 links) plus a base64 variant per chunk and a manifest.
          cp out/manifest.json .
          cp out/sub*.txt .
          git add -f manifest.json sub*.txt
          git commit -m "sub update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git branch -M sub-tmp sub
          git push -f origin sub
          echo "Published $(ls sub[0-9]*.txt | grep -v _b64 | wc -l) chunked sub link(s) + base64 variants + manifest to sub branch"
          python3 - << 'PYEOF'
          import json
          m = json.load(open('manifest.json'))
          print(f"total configs: {m['total_configs']} across {len(m['chunks'])} link(s) (chunk size {m['chunk_size']})")
          for c in m['chunks']:
              print(f"  {c['file']}: {c['count']} configs")
          PYEOF
