name: Sub Factory

on:
  workflow_dispatch:
  schedule:
    # 03:33 UTC daily (07:03 Tehran time)
    - cron: '33 3 * * *'

permissions:
  contents: write

jobs:
  build-subscription:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Fetch & merge free configs
        env:
          SOURCES: |
            https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/All_Configs_Sub.txt
            https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt
            https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt
        run: |
          python3 << 'PYEOF'
          import base64, os, re, urllib.request

          SCHEME = re.compile(r'^\s*(vmess|vless|trojan|ss)://\S+\s*$', re.IGNORECASE)
          BAD = re.compile(r'(?!x)x', re.I)  # placeholder, extend with blocklist regexes here

          def fetch(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Derafsh-SubFactory/1.0'})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.read().decode('utf-8', 'ignore')
              except Exception as e:
                  print(f"WARN fetch failed: {url} -> {e}")
                  return ""

          def decode_if_base64(text):
              text = text.strip()
              # Heuristic: aggregators often ship base64 blobs; keep raw lines as-is anyway.
              return text

          lines = []
          for url in os.environ.get("SOURCES", "").splitlines():
              url = url.strip()
              if not url:
                  continue
              body = fetch(url)
              if not body:
                  continue
              # Some sources wrap the whole payload in base64
              if '://' not in body and re.fullmatch(r'[A-Za-z0-9+/=\s]+', body[:4096] or ''):
                  try:
                      body = base64.b64decode(body + '===').decode('utf-8', 'ignore')
                  except Exception:
                      pass
              for ln in body.splitlines():
                  ln = ln.strip()
                  if ln and SCHEME.match(ln):
                      lines.append(ln)

          seen, uniq = set(), []
          for ln in lines:
              if ln not in seen:
                  seen.add(ln)
                  uniq.append(ln)

          # Remove obviously broken entries (no host part)
          cleaned = []
          for ln in uniq:
              m = re.match(r'^\w+://', ln)
              if m and len(ln) > 20:
                  cleaned.append(ln)

          plain = "\n".join(cleaned) + "\n"
          b64 = base64.b64encode(plain.encode()).decode()

          os.makedirs('out', exist_ok=True)
          with open('out/sub.txt', 'w') as f:
              f.write(plain)
          with open('out/sub_base64.txt', 'w') as f:
              f.write(b64)
          print(f"configs merged: {len(cleaned)}")
          PYEOF

      - name: Publish to sub branch
        run: |
          git config user.name "derafsh-sub-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan sub-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          mv out/sub.txt sub.txt
          mv out/sub_base64.txt sub_base64.txt
          git add -f sub.txt sub_base64.txt
          git commit -m "sub update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git branch -M sub-tmp sub
          git push -f origin sub
          echo "Published $(grep -c '' sub.txt) configs to sub branch"
